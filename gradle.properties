# Enable the build cache to save time by reusing outputs produced by other successful builds.
# https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
# Enable the configuration cache to reuse the build configuration and enable parallel task execution.
# (Note that some plugins may not yet be compatible with the configuration cache.)
# https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true

# Windows/AGP can be sensitive to file locks in build directories; disabling VFS watching reduces
# the chance Gradle holds open file handles (or races with external scanners).
org.gradle.vfs.watch=false

# Kotlin/AGP/KMP can be memory-hungry (lint + JS + metadata compilation).
# Prevent Gradle daemon Metaspace OOMs on larger builds.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# AndroidX (required for androidx.* dependencies like AppCompat)
android.useAndroidX=true
android.enableJetifier=true
